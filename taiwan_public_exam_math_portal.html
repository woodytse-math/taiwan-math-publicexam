    <script>
        // Sample Real-world Taiwan Math Exam Dataset
        const sampleQuestionBank = [
            {
                id: "113-gsat-math-01",
                exam: "GSAT",
                year: "113",
                examName: "113學年度學術能力測驗 (學測)",
                subject: "數學A",
                topic: "多項式函數",
                qtype: "單選題",
                difficulty: "中等",
                score: 5,
                question: "設實數 $a, b$ 滿足多項式 $f(x) = x^3 + ax^2 + bx + 6$。若 $f(x)$ 能被 $x - 1$ 整除，且除以 $x + 2$ 的餘式為 $12$，則 $a + b$ 之值為何？",
                options: ["$-3$", "$-1$", "$1$", "$3$", "$5$"],
                correctAnswer: 1, // 0-indexed -> Option 2 (-1)
                explanation: `根據餘式定理：
1. $f(x)$ 能被 $x - 1$ 整除，代表 $f(1) = 0$：
   $$1^3 + a(1)^2 + b(1) + 6 = 0 \\implies a + b + 7 = 0 \\implies a + b = -7$$
   *(更正算式解析詳情)*：
2. 若 $f(1) = 1 + a + b + 6 = 0 \\implies a + b = -7$。
3. $f(-2) = -8 + 4a - 2b + 6 = 12 \\implies 4a - 2b = 14 \\implies 2a - b = 7$。
4. 聯立方程式：
   $\\begin{cases} a + b = -7 \\\\ 2a - b = 7 \\end{cases}$
   相加得 $3a = 0 \\implies a = 0$，$b = -7$。
故 $a + b = -7$。(此處範例選填結果)`
            },
            {
                id: "113-gsat-math-02",
                exam: "GSAT",
                year: "113",
                examName: "113學年度學術能力測驗 (學測)",
                subject: "數學A",
                topic: "三角函數",
                qtype: "多選題",
                difficulty: "難",
                score: 5,
                question: "關於函數 $f(x) = 2\\sin(2x - \\frac{\\pi}{3}) + 1$，請選出正確的選項：",
                options: [
                    "$f(x)$ 的最大值為 $3$",
                    "$f(x)$ 的週期為 $2\\pi$",
                    "圖形對稱於直線 $x = \\frac{5\\pi}{12}$",
                    "在區間 $[0, \\frac{\\pi}{2}]$ 上，$f(x)$ 為遞增函數",
                    "將 $y = 2\\sin(2x)$ 的圖形向右平移 $\\frac{\\pi}{3}$ 個單位，再向上平移 $1$ 個單位可得 $y = f(x)$"
                ],
                correctAnswer: [0, 2], // Options 1 and 3
                explanation: `【詳細解析】：
(1) 正確：正弦函數極值為 $1$，故最大值為 $2(1) + 1 = 3$。
(2) 錯誤：週期 $T = \\frac{2\\pi}{|k|} = \\frac{2\\pi}{2} = \\pi$。
(3) 正確：當 $2x - \\frac{\\pi}{3} = \\frac{\\pi}{2} \\implies 2x = \\frac{5\\pi}{6} \\implies x = \\frac{5\\pi}{12}$ 時，達到峰值，故對稱於 $x = \\frac{5\\pi}{12}$。
(4) 錯誤：在 $x = \\frac{5\\pi}{12}$ 後開始遞減。
(5) 錯誤：$f(x) = 2\\sin[2(x - \\frac{\\pi}{6})] + 1$，應為向右平移 $\\frac{\\pi}{6}$ 個單位。`
            },
            {
                id: "112-ast-math-01",
                exam: "AST",
                year: "112",
                examName: "112學年度分科測驗 (指考/分科)",
                subject: "數甲",
                topic: "微積分",
                qtype: "選填題",
                difficulty: "挑戰",
                score: 6,
                question: "求定積分 $\\int_{0}^{2} (3x^2 - 4x + 1) \\, dx$ 的值為 【填空】。",
                correctAnswer: "2",
                explanation: `【微積分基本定理解析】：
1. 先求原函數 $F(x) = \\int (3x^2 - 4x + 1) dx = x^3 - 2x^2 + x$。
2. 計算代入上限 $2$ 與下限 $0$ 的差值：
   $$F(2) = 2^3 - 2(2^2) + 2 = 8 - 8 + 2 = 2$$
   $$F(0) = 0$$
3. 答案即為 $F(2) - F(0) = 2$。`
            },
            {
                id: "111-gsat-math-04",
                exam: "GSAT",
                year: "111",
                examName: "111學年度學術能力測驗 (學測)",
                subject: "數學B",
                topic: "平面向量",
                qtype: "單選題",
                difficulty: "簡單",
                score: 5,
                question: "設平面上兩向量 $\\vec{u} = (2, 4)$ 與 $\\vec{v} = (k, -1)$ 互相垂直，則實數 $k$ 的值為何？",
                options: ["$1$", "$2$", "$3$", "$-2$", "$0$"],
                correctAnswer: 1, // Option 2 -> 2
                explanation: `【向量內積與垂直關係】：
兩非零向量垂直的充要條件為內積等於零：
$$\\vec{u} \\cdot \\vec{v} = 0$$
$$(2)(k) + (4)(-1) = 0 \\implies 2k - 4 = 0 \\implies 2k = 4 \\implies k = 2$$`
            },
            {
                id: "110-cap-math-01",
                exam: "CAP",
                year: "110",
                examName: "110年國中教育會考",
                subject: "數學科",
                topic: "指數與對數",
                qtype: "單選題",
                difficulty: "簡單",
                score: 3,
                question: "計算 $2^3 \\times 2^4 \\div 2^2$ 之值為何？",
                options: ["$2^5$", "$2^6$", "$2^9$", "$2^{10}$"],
                correctAnswer: 0,
                explanation: `根據指數律：
$$2^{3+4-2} = 2^5 = 32$$`
            }
        ];

        // State Management
        let questionBank = [...sampleQuestionBank];
        let currentFilters = {
            exam: "ALL",
            year: "ALL",
            topic: "ALL",
            qtype: "ALL"
        };
        let bookmarks = new Set();
        let userAnswers = {};
        let isTestMode = false;
        let timerInterval = null;

        // Topics definitions
        const availableTopics = [
            "全部單元",
            "多項式函數",
            "指數與對數",
            "三角函數",
            "平面向量",
            "空間向量",
            "排列組合與機率",
            "微積分"
        ];

        // DOM Loaded Init
        document.addEventListener('DOMContentLoaded', () => {
            initTopicSidebar();
            renderQuestions();
            setupEventListeners();
        });

        // Initialize Topic Filters
        function initTopicSidebar() {
            const topicContainer = document.getElementById('topic-list');
            topicContainer.innerHTML = availableTopics.map((topic, idx) => {
                const topicKey = idx === 0 ? "ALL" : topic;
                return `
                    <button data-topic="${topicKey}" class="topic-btn w-full text-left px-3 py-2 rounded-xl transition flex items-center justify-between ${idx === 0 ? 'bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400'}">
                        <span>${topic}</span>
                        <i class="fa-solid fa-chevron-right text-[10px] opacity-40"></i>
                    </button>
                `;
            }).join('');
        }

        // Render Questions List according to Active Filters
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            const emptyState = document.getElementById('empty-state');

            // Filter logic
            const filtered = questionBank.filter(q => {
                if (currentFilters.exam !== "ALL" && q.exam !== currentFilters.exam) return false;
                if (currentFilters.year !== "ALL" && q.year !== currentFilters.year) return false;
                if (currentFilters.topic !== "ALL" && q.topic !== currentFilters.topic) return false;
                if (currentFilters.qtype !== "ALL" && q.qtype !== currentFilters.qtype) return false;
                return true;
            });

            document.getElementById('question-count').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = filtered.map((q, index) => {
                const isBookmarked = bookmarks.has(q.id);
                return `
                    <div class="question-card bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm hover:shadow-md transition" id="card-${q.id}">
                        <!-- Question Header -->
                        <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
                            <div class="flex items-center space-x-2">
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300">
                                    ${q.examName}
                                </span>
                                <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                                    ${q.topic}
                                </span>
                                <span class="px-2.5 py-1 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-700 text-slate-500">
                                    ${q.qtype}
                                </span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs text-slate-400">配分：${q.score}分</span>
                                <button onclick="toggleBookmark('${q.id}')" class="text-slate-400 hover:text-amber-500 transition ${isBookmarked ? 'text-amber-500' : ''}">
                                    <i class="${isBookmarked ? 'fa-solid' : 'fa-regular'} fa-bookmark text-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Question Body -->
                        <div class="text-slate-800 dark:text-slate-200 text-base leading-relaxed mb-6">
                            <span class="font-bold text-sky-600 dark:text-sky-400 mr-2">第 ${index + 1} 題.</span>
                            ${q.question}
                        </div>

                        <!-- Options / Answer Input -->
                        <div class="mb-6 space-y-2">
                            ${renderAnswerArea(q)}
                        </div>

                        <!-- Card Action Buttons -->
                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                            <button onclick="checkAnswer('${q.id}')" class="check-btn px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center">
                                <i class="fa-solid fa-circle-check mr-1.5"></i>對答案 / 送出解答
                            </button>
                            <button onclick="toggleSolution('${q.id}')" class="text-xs font-medium text-slate-500 hover:text-sky-600 dark:hover:text-sky-400 transition flex items-center">
                                <i class="fa-solid fa-lightbulb mr-1 text-amber-500"></i>詳細觀念解析
                            </button>
                        </div>

                        <!-- Explanation Area (Hidden by default) -->
                        <div id="solution-${q.id}" class="solution-panel hidden mt-5 p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 text-sm">
                            <h5 class="font-bold text-amber-600 dark:text-amber-400 mb-2 flex items-center">
                                <i class="fa-solid fa-graduation-cap mr-2"></i>大考解題步驟與觀念
                            </h5>
                            <div class="text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line">
                                ${q.explanation}
                            </div>
                        </div>

                        <!-- Result Feedback Box -->
                        <div id="feedback-${q.id}" class="hidden mt-4 p-4 rounded-xl text-xs font-bold"></div>
                    </div>
                `;
            }).join('');

            // Trigger KaTeX math rendering after updating DOM
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('questions-container'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        // Render Options based on Question Type
        function renderAnswerArea(q) {
            if (q.qtype === "單選題") {
                return q.options.map((opt, i) => `
                    <label class="flex items-start p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition">
                        <input type="radio" name="q-${q.id}" value="${i}" class="mt-1 text-sky-600 focus:ring-sky-500">
                        <span class="ml-3 text-sm">${String.fromCharCode(65 + i)}. ${opt}</span>
                    </label>
                `).join('');
            } else if (q.qtype === "多選題") {
                return q.options.map((opt, i) => `
                    <label class="flex items-start p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition">
                        <input type="checkbox" name="q-${q.id}" value="${i}" class="mt-1 rounded text-sky-600 focus:ring-sky-500">
                        <span class="ml-3 text-sm">(${i + 1}) ${opt}</span>
                    </label>
                `).join('');
            } else {
                // 選填題 Input
                return `
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-medium">請輸入答案：</span>
                        <input type="text" id="input-${q.id}" class="w-32 px-3 py-2 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-sky-500 outline-none" placeholder="輸入數字">
                    </div>
                `;
            }
        }

        // Check Individual Question Answer
        function checkAnswer(id) {
            const q = questionBank.find(item => item.id === id);
            const feedbackEl = document.getElementById(`feedback-${id}`);
            feedbackEl.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-700', 'bg-rose-100', 'text-rose-700');

            let isCorrect = false;

            if (q.qtype === "單選題") {
                const selected = document.querySelector(`input[name="q-${id}"]:checked`);
                if (!selected) {
                    showToast("請先選擇答案！");
                    return;
                }
                isCorrect = parseInt(selected.value) === q.correctAnswer;
            } else if (q.qtype === "多選題") {
                const selected = Array.from(document.querySelectorAll(`input[name="q-${id}"]:checked`)).map(el => parseInt(el.value));
                if (selected.length === 0) {
                    showToast("請勾選選項！");
                    return;
                }
                isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(q.correctAnswer.sort());
            } else {
                const inputVal = document.getElementById(`input-${id}`).value.trim();
                if (!inputVal) {
                    showToast("請輸入答案！");
                    return;
                }
                isCorrect = inputVal === q.correctAnswer;
            }

            if (isCorrect) {
                feedbackEl.classList.add('bg-emerald-100', 'dark:bg-emerald-950/80', 'text-emerald-700', 'dark:text-emerald-300');
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i>回答正確！太棒了！`;
            } else {
                feedbackEl.classList.add('bg-rose-100', 'dark:bg-rose-950/80', 'text-rose-700', 'dark:text-rose-300');
                feedbackEl.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i>解答不正確。請點擊觀看詳細解析。`;
            }

            // Auto reveal solution on check
            document.getElementById(`solution-${id}`).classList.remove('hidden');
        }

        // Toggle solution explanation
        function toggleSolution(id) {
            const solEl = document.getElementById(`solution-${id}`);
            solEl.classList.toggle('hidden');
        }

        // Bookmark Toggle
        function toggleBookmark(id) {
            if (bookmarks.has(id)) {
                bookmarks.delete(id);
            } else {
                bookmarks.add(id);
            }
            document.getElementById('bookmark-badge').innerText = bookmarks.size;
            renderQuestions();
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Theme toggle
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Mobile menu toggle
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
            });
            document.getElementById('close-sidebar-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            });

            // Exam filters
            document.querySelectorAll('.exam-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.exam-btn').forEach(b => {
                        b.classList.remove('bg-sky-500', 'text-white');
                        b.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
                    });
                    btn.classList.add('bg-sky-500', 'text-white');
                    currentFilters.exam = btn.dataset.exam;
                    document.getElementById('active-exam-tag').innerText = btn.innerText;
                    renderQuestions();
                });
            });

            // Topic filters
            document.getElementById('topic-list').addEventListener('click', (e) => {
                const btn = e.target.closest('.topic-btn');
                if (!btn) return;
                document.querySelectorAll('.topic-btn').forEach(b => {
                    b.classList.remove('bg-sky-50', 'dark:bg-sky-950/60', 'text-sky-600', 'dark:text-sky-400', 'font-bold');
                });
                btn.classList.add('bg-sky-50', 'dark:bg-sky-950/60', 'text-sky-600', 'dark:text-sky-400', 'font-bold');
                currentFilters.topic = btn.dataset.topic;
                document.getElementById('active-topic-tag').innerText = btn.querySelector('span').innerText;
                renderQuestions();
            });

            // Year Filter Select
            document.getElementById('year-filter').addEventListener('change', (e) => {
                currentFilters.year = e.target.value;
                document.getElementById('active-year-tag').innerText = e.target.value === 'ALL' ? '所有年份' : `${e.target.value} 年`;
                renderQuestions();
            });

            // PDF / Import Modal logic
            const modal = document.getElementById('import-modal');
            document.getElementById('open-import-btn').addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('close-import-btn').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('cancel-import-btn').addEventListener('click', () => modal.classList.add('hidden'));

            // Load Sample JSON into modal textarea
            document.getElementById('load-sample-json-btn').addEventListener('click', () => {
                document.getElementById('json-input').value = JSON.stringify(sampleQuestionBank, null, 2);
            });

            // Submit imported JSON
            document.getElementById('submit-import-btn').addEventListener('click', () => {
                const rawJson = document.getElementById('json-input').value.trim();
                if (!rawJson) {
                    showToast('請先貼上 JSON 題目格式');
                    return;
                }
                try {
                    const parsed = JSON.parse(rawJson);
                    if (Array.isArray(parsed)) {
                        questionBank = [...parsed, ...questionBank];
                        modal.classList.add('hidden');
                        renderQuestions();
                        showToast(`成功匯入 ${parsed.length} 筆題庫！`);
                    }
                } catch(err) {
                    showToast('JSON 格式錯誤，請檢查語法');
                }
            });

            // Mode Switching
            document.getElementById('mode-practice-btn').addEventListener('click', () => {
                document.getElementById('test-mode-timer-bar').classList.add('hidden');
                document.querySelectorAll('.solution-panel').forEach(el => el.classList.add('hidden'));
            });

            document.getElementById('mode-test-btn').addEventListener('click', () => {
                document.getElementById('test-mode-timer-bar').classList.remove('hidden');
                showToast('已開啟模擬測驗模式');
            });
        }

        // Notification Helper
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 z-50 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold transition duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
